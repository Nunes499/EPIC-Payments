services:
  db:
    image: postgres:16-alpine
    container_name: epic-payments-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: epic_payments
      POSTGRES_USER: epic_user
      POSTGRES_PASSWORD: epic_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: epic-payments-backend
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: epic-payments-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: